<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- iPad Air 4 (820×1180pt, 세로) + Pro Surf 키오스크 — 확대/스크롤 금지 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Fit Guide</title>
<style>
  @font-face {
    font-family: 'Busan';
    src: url('https://cdn.jsdelivr.net/korean-webfonts/1/orgs/govs/busan/Busan/Busan.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/korean-webfonts/1/orgs/govs/busan/Busan/Busan.woff') format('woff');
    font-weight: 400;
    font-display: swap;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  html, body {
    position: fixed;          /* iOS 고무줄 스크롤(바운스) 방지 */
    inset: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f8f7f5;
    font-family: 'Busan', -apple-system, sans-serif;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
  }

  /* ── 로딩 화면 ─────────────────────────────────────────────── */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: #f8f7f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  #loading-title {
    font-size: 16px;
    letter-spacing: 0.2em;
    color: #1a1a1a;
    text-transform: uppercase;
    margin-bottom: 30px;
  }
  #loading-bar-wrap {
    width: 240px;
    height: 2px;
    background: rgba(0,0,0,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: #1a1a1a;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  #loading-percent { font-size: 11px; letter-spacing: 0.15em; color: #999; }
  #loading-status  { font-size: 10px; letter-spacing: 0.1em; color: #bbb; margin-top: 8px; }

  /* ── 자동재생이 막혔을 때 1회 터치 유도 ─────────────────────── */
  #tap-to-start {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(248,247,245,0.6);
    font-size: 14px;
    letter-spacing: 0.24em;
    color: #1a1a1a;
    text-transform: uppercase;
  }
  #tap-to-start.visible { display: flex; }

  /* ── 전체 앱 ───────────────────────────────────────────────── */
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f7f5;
  }

  /* 영상(1600×2400 = 2:3) 비율 박스. 실제 px 크기는 JS(layout)가
     window.innerWidth/innerHeight 로 계산해 넣는다 — 구형 iPadOS WebView 는
     dvh 를 모르므로 CSS 는 vh 폴백만 둔다.
     iPad Air 4 세로(820×1180) → 787×1180, 좌우 약 16px 여백 */
  #video-wrap {
    position: relative;
    height: 100vh;
    width: 66.6667vh;
    max-width: 100vw;
    max-height: 150vw;
    overflow: hidden;
    background: #f8f7f5;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
    background: #f8f7f5;
    opacity: 0;
    transition: opacity 0.18s ease;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    pointer-events: none;     /* iOS 기본 영상 컨트롤/전체화면 진입 방지 */
  }
  video.show { opacity: 1; }
  video::-webkit-media-controls,
  video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

  #autoplay-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #autoplay-indicator.visible { opacity: 1; }
  #autoplay-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #1a1a1a;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.3; transform: scale(0.6); }
  }
  #autoplay-label { font-size: 8px; letter-spacing: 0.24em; color: #555; text-transform: uppercase; }

  /* ── 핏 버튼 (오른쪽 세로 스택) ────────────────────────────────
     모든 치수는 영상 원본(1600×2400) 실측값 비율. --H = #video-wrap 실제 높이(px) */
  :root { --H: 100vh; }

  #sidebar {
    position: absolute;
    top: 16.5417%;
    right: 7.21875%;
    width: 25.125%;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: calc(var(--H) * 0.0291667);
  }
  .fit-group {
    display: flex;
    flex-direction: column;
    gap: calc(var(--H) * 0.0075);
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: calc(var(--H) * 0.0045);
    height: calc(var(--H) * 0.0141667);
  }
  .group-name {
    font-size: calc(var(--H) * 0.0125);
    letter-spacing: 0.1em;
    color: #1a1a1a;
    text-transform: uppercase;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
  .group-rule { flex: 1; height: 1.5px; background: rgba(0,0,0,0.18); }

  .fit-btn {
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: calc(var(--H) * 0.0491667);
    padding: 0 calc(var(--H) * 0.0155);
    background: #ffffff;
    border: 1.5px solid #cccccc;
    border-radius: calc(var(--H) * 0.0058);
    cursor: pointer;
    transition: background 0.22s ease, border-color 0.22s ease, transform 0.15s ease;
  }
  .fit-btn.active { background: #5a5a5a; border-color: #5a5a5a; }
  .fit-btn:active { transform: scale(0.97); }

  .btn-label {
    font-size: calc(var(--H) * 0.0133333);
    letter-spacing: 0.08em;
    color: #b5b5b5;
    text-transform: uppercase;
    white-space: nowrap;
    font-weight: 700;
    line-height: 1.15;
  }
  .fit-btn.active .btn-label { color: #ffffff; }

  #ai-notice {
    position: absolute;
    right: 7.21875%;
    bottom: 1.6%;
    z-index: 20;
    font-size: calc(var(--H) * 0.0095);
    letter-spacing: 0.18em;
    color: rgba(0,0,0,0.35);
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading-screen">
  <div id="loading-title">Fit Guide</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-percent">0%</div>
  <div id="loading-status">loading videos...</div>
</div>

<div id="tap-to-start">Tap to start</div>

<div id="app" style="display:none;">
  <div id="video-wrap">
    <video id="main-video" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"></video>
    <div id="autoplay-indicator">
      <div id="autoplay-dot"></div>
      <div id="autoplay-label">Auto</div>
    </div>
    <div id="sidebar"></div>
    <div id="ai-notice">AI-GENERATED CONTENT</div>
  </div>
</div>

<script>
/* ================================================================
   iPad Air 4 / Pro Surf(WKWebView) 버전

   TCL 버전과 다른 점
   · 서비스 워커 미사용 — iOS 앱 내 WKWebView(Pro Surf 등)는 서비스 워커를
     지원하지 않고, Safari 에서도 SW 가 만든 Range 응답으로는 영상 재생이
     불안정하다. 대신 영상을 메모리(Blob)로 미리 받아 두고 전환한다.
   · 영상은 iOS 하드웨어 디코더가 지원하는 H.264 High@L5.1 로 재인코딩된
     파일을 쓴다. (원본은 Level 6.0 이라 iPad 에서 재생되지 않음)
   · 자동재생이 막히면 "Tap to start" 를 띄워 1회 터치로 시작한다.
   ================================================================ */
const FITS = [
  { name: 'Wide',          path: './wide-uni.mp4'            , group: 'Uni'   },
  { name: 'Curved Wide',   path: './curved-wide-uni.mp4'     , group: 'Uni'   },
  { name: 'Semi Wide',     path: './semi-wide-women.mp4'     , group: 'Women' },
  { name: 'Wide',          path: './wide-women.mp4'          , group: 'Women' },
  { name: 'Feminine Wide', path: './feminine-wide-women.mp4' , group: 'Women' },
  { name: 'Flare',         path: './flare-women.mp4'         , group: 'Women' },
];

const INACTIVITY_TIMEOUT_MS = 7000;

let currentIndex    = 0;
let isAutoplaying   = true;
let inactivityTimer = null;

const video          = document.getElementById('main-video');
const sidebar        = document.getElementById('sidebar');
const autoInd        = document.getElementById('autoplay-indicator');
const wrapEl         = document.getElementById('video-wrap');
const aiNotice       = document.getElementById('ai-notice');
const appEl          = document.getElementById('app');
const tapEl          = document.getElementById('tap-to-start');
const loadingScreen  = document.getElementById('loading-screen');
const loadingBar     = document.getElementById('loading-bar');
const loadingPercent = document.getElementById('loading-percent');
const loadingStatus  = document.getElementById('loading-status');

/* WKWebView 는 HTML 속성만으로는 muted 가 반영되지 않는 경우가 있어 속성으로도 지정 */
video.muted = true;
video.defaultMuted = true;
video.playsInline = true;
video.setAttribute('muted', '');
video.setAttribute('playsinline', '');
video.setAttribute('webkit-playsinline', '');

/* ================================================================
   영상 사전 로드 (Blob URL)
   한 번 받아 두면 전환 시 네트워크를 타지 않아 즉시 재생된다.
   받기 실패한 영상은 원래 경로로 직접 재생한다.
   ================================================================ */
const blobUrls = [];

function srcFor(i) { return blobUrls[i] || FITS[i].path; }

async function fetchAsBlob(i) {
  const res = await fetch(FITS[i].path, { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  const buf = await res.arrayBuffer();
  blobUrls[i] = URL.createObjectURL(new Blob([buf], { type: 'video/mp4' }));
}

/* 첫 영상만 받고 바로 시작, 나머지는 재생 중 백그라운드로 받는다 */
async function preload() {
  setProgress(0);
  try { await fetchAsBlob(0); } catch (e) { console.warn('preload 0 실패', e); }
  setProgress(100);
  showApp();
  for (let i = 1; i < FITS.length; i++) {
    try { await fetchAsBlob(i); } catch (e) { console.warn('preload 실패', FITS[i].path, e); }
  }
}

function setProgress(p) {
  loadingBar.style.width = p + '%';
  loadingPercent.textContent = Math.round(p) + '%';
}

function showApp() {
  appEl.style.display = '';
  loadingScreen.classList.add('hidden');
  setTimeout(() => { loadingScreen.style.display = 'none'; }, 600);
  init();
}

/* ================================================================
   레이아웃 — 화면 안에 2:3 영상 박스를 꽉 맞춘다 (contain)
   ================================================================ */
const VIDEO_RATIO = 1600 / 2400;
const CARD_L = 1082.5 / 1600;
const CARD_R = 1484.5 / 1600;

function layout() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  let h = vh, w = Math.round(vh * VIDEO_RATIO);
  if (w > vw) { w = vw; h = Math.round(vw / VIDEO_RATIO); }
  wrapEl.style.width  = w + 'px';
  wrapEl.style.height = h + 'px';
  wrapEl.style.maxWidth = 'none';
  wrapEl.style.maxHeight = 'none';

  document.documentElement.style.setProperty('--H', h + 'px');
  const left  = Math.round(w * CARD_L);
  const right = Math.round(w * (1 - CARD_R));
  sidebar.style.left  = left + 'px';
  sidebar.style.right = right + 'px';
  sidebar.style.width = 'auto';
  aiNotice.style.right = right + 'px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 300));

/* ================================================================
   핏 가이드 로직
   ================================================================ */
function buildUI() {
  const groups = [];
  FITS.forEach((fit, i) => {
    const last = groups[groups.length - 1];
    if (last && last.name === fit.group) last.items.push({ fit, i });
    else groups.push({ name: fit.group, items: [{ fit, i }] });
  });

  groups.forEach((g) => {
    const sec = document.createElement('div');
    sec.className = 'fit-group';

    const head = document.createElement('div');
    head.className = 'group-head';
    head.innerHTML = `<span class="group-name">${g.name}</span><span class="group-rule"></span>`;
    sec.appendChild(head);

    g.items.forEach(({ fit, i }) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fit-btn' + (i === 0 ? ' active' : '');
      btn.innerHTML = `<span class="btn-label">${fit.name}</span>`;
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); onFitTapped(i); }, { passive: false });
      btn.addEventListener('mousedown', () => onFitTapped(i));   // 데스크톱 테스트용
      sec.appendChild(btn);
    });

    sidebar.appendChild(sec);
  });
}

/* 자동재생이 막히면 Tap to start 표시 → 아무 곳이나 터치하면 재생 */
function playVideo() {
  const p = video.play();
  if (p && typeof p.catch === 'function') {
    p.then(() => tapEl.classList.remove('visible'))
     .catch((err) => {
       if (err && err.name === 'NotAllowedError') tapEl.classList.add('visible');
     });
  }
}
function unlockPlayback() {
  tapEl.classList.remove('visible');
  video.muted = true;
  video.play().catch(() => {});
}
tapEl.addEventListener('touchstart', (e) => { e.preventDefault(); unlockPlayback(); }, { passive: false });
tapEl.addEventListener('mousedown', unlockPlayback);

function setEndedHandler() {
  video.onended = isAutoplaying
    ? () => { if (isAutoplaying) switchTo((currentIndex + 1) % FITS.length); }
    : () => { video.currentTime = 0; playVideo(); };   // 수동 선택 중에는 같은 핏 반복
}

let switchToken = 0;

function switchTo(index, immediate) {
  if (index === currentIndex && video.src && !immediate) return;
  currentIndex = index;
  const token = ++switchToken;

  const loadAndShow = () => {
    if (token !== switchToken) return;
    video.src = srcFor(index);
    video.load();
    let done = false;
    const reveal = () => {
      if (done || token !== switchToken) return;
      done = true;
      video.removeEventListener('loadeddata', reveal);
      video.removeEventListener('canplay', reveal);
      updateUI();
      video.classList.add('show');
      setEndedHandler();
    };
    video.addEventListener('loadeddata', reveal);
    video.addEventListener('canplay', reveal);
    setTimeout(reveal, 800);
    playVideo();
  };

  if (immediate) { loadAndShow(); return; }
  video.classList.remove('show');
  setTimeout(loadAndShow, 120);
}

function updateUI() {
  document.querySelectorAll('.fit-btn').forEach((btn, i) => btn.classList.toggle('active', i === currentIndex));
  autoInd.classList.toggle('visible', isAutoplaying);
}

function startAutoplay() { isAutoplaying = true;  updateUI(); setEndedHandler(); }
function pauseAutoplay() { isAutoplaying = false; setEndedHandler(); updateUI(); }

function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(startAutoplay, INACTIVITY_TIMEOUT_MS);
}

function onFitTapped(index) {
  pauseAutoplay();
  resetInactivityTimer();
  switchTo(index);
}

/* ── 자동 복구 ───────────────────────────────────────────────────
   · 재생 오류: Blob 이 깨졌을 수 있으니 버리고 원래 경로로 재시도,
     그래도 안 되면 다음 핏으로.
   · 멈춤 감시: 재생 위치가 6초간 그대로면 다시 재생 시도. */
let recoverTries = 0;
video.addEventListener('error', () => {
  if (blobUrls[currentIndex]) {
    URL.revokeObjectURL(blobUrls[currentIndex]);
    blobUrls[currentIndex] = null;
  }
  if (recoverTries < 2) {
    recoverTries++;
    setTimeout(() => switchTo(currentIndex, true), 1000);
  } else {
    recoverTries = 0;
    switchTo((currentIndex + 1) % FITS.length, true);
  }
});
video.addEventListener('loadeddata', () => { recoverTries = 0; });

let lastTime = -1, stuckSec = 0;
setInterval(() => {
  if (tapEl.classList.contains('visible') || !video.src) return;
  if (video.currentTime === lastTime) {
    if (++stuckSec >= 6) { stuckSec = 0; switchTo(currentIndex, true); }
    else if (video.paused) playVideo();
  } else {
    stuckSec = 0;
    lastTime = video.currentTime;
  }
}, 1000);

/* 키오스크 앱이 백그라운드에서 돌아오면 재생 재개 */
document.addEventListener('visibilitychange', () => { if (!document.hidden) { layout(); playVideo(); } });
window.addEventListener('pageshow', () => { layout(); playVideo(); });

/* iOS 핀치 줌·더블탭 줌 차단 */
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());

function init() {
  layout();
  buildUI();
  currentIndex = 0;
  switchTo(0, true);
  startAutoplay();
}

preload();
</script>
</body>
</html>
